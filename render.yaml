services:
  - type: web
    name: continuity-memory
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    numInstances: 1
    maxShutdownDelaySeconds: 30
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MEMORY_DATA_DIR
        value: /tmp/dudulove-memory
      - key: MEMORY_DATABASE_URL
        sync: false
      - key: MEMORY_SOURCE_ID
        generateValue: true
      - key: MEMORY_ADMIN_TOKEN
        generateValue: true
